[dependencies]
htmd_lib = { package = "htmd", version = "0.5" }
lol_html = "2"
# `markup5ever_rcdom` is already a transitive dep via htmd. Pinning it as a
# direct dep lets the `drop_image_only_links` handler walk `<a>` children via
# the public `NodeData` API so it can make a DOM-structural decision instead
# of pattern-matching rendered markdown. Version tracks htmd's own pin.
markup5ever_rcdom = "0.38"
pyo3 = "0.28"
regex = "1"

[lib]
name = "htmd"
crate-type = ["cdylib"]

[package]
name = "htmd-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for htmd, an HTML to Markdown converter."

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
panic = "abort"
debug = false
strip = "debuginfo"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
